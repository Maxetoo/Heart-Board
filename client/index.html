    <script>
      // Early protection against injected browser extension errors (MetaMask / Web3 wallets in iframe)
      (function() {
        var isExt = function(str) {
          if (!str) return false;
          var s = String(str).toLowerCase();
          return s.indexOf('metamask') !== -1 || 
                 s.indexOf('ethereum') !== -1 || 
                 s.indexOf('failed to connect to metamask') !== -1 ||
                 s.indexOf('chrome-extension://') !== -1 ||
                 s.indexOf('moz-extension://') !== -1;
        };

        window.addEventListener('error', function(e) {
          if (isExt(e.message) || isExt(e.filename) || (e.error && isExt(e.error.message))) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return false;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          var reason = e.reason;
          var msg = (reason && reason.message) ? reason.message : String(reason || '');
          if (isExt(msg)) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);

        // Define a passive, safe stub if window.ethereum doesn't exist or is requested by extensions
        if (typeof window !== 'undefined') {
          try {
            if (!window.ethereum) {
              var stubEthereum = {
                isMetaMask: false,
                request: function() { return Promise.resolve(null); },
                sendAsync: function(payload, cb) { if (cb) cb(null, { result: null }); },
                send: function(payload, cb) { if (cb) cb(null, { result: null }); },
                on: function() {},
                removeListener: function() {},
                autoRefreshOnNetworkChange: false,
              };
              Object.defineProperty(window, 'ethereum', {
                get: function() { return stubEthereum; },
                set: function() {},
                configurable: true,
              });
            }
          } catch (err) {}
        }
      })();
    </script>
