<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#FE6349" />

    <!--
      The Heartboard mark, cropped square out of src/assets/heartboard logo.png.
      That source is 611x408 with the mark occupying ~137px in the middle, so
      pointing a favicon straight at it would render the artwork a few pixels
      wide in the tab; these are cropped to the artwork and sized properly.
      Largest first — browsers take the first one they can use.
    -->
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <!-- Opaque on purpose: iOS composites a transparent touch icon on black. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <title>Heartboard | Share your appreciation</title>
    <meta name="description"
        content="Heartboard — send appreciation boards, share love, and celebrate the people that matter." />

    <!-- Open Graph -->
    <meta property="og:title" content="Heartboard | Share your appreciation" />
    <meta property="og:description"
        content="Create beautiful appreciation boards and share them with the people you love." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://heartboardapp.com" />
    <!-- A .ico here rendered as a blank box in most link previews. -->
    <meta property="og:image" content="https://heartboardapp.com/favicon-512.png" />
    <meta property="og:image:alt" content="Heartboard Logo" />

    <!-- Canonical -->
    <link rel="canonical" href="https://heartboardapp.com/" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,300;0,400;0,600;0,700;0,800;1,400&family=Caveat:wght@400;700&display=swap"
        rel="stylesheet" />
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
</body>

</html>
